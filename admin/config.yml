# Decap CMS configuration for Hope Anchored in Christ.
# Edit content at /admin after this repo is pushed to GitHub.
# Repo: Flash1095/hope-anchored-in-christ (see README for the login setup).
backend:
  name: git-gateway
  branch: main
  identity_url: https://hope-anchored-in-christ.netlify.app/.netlify/identity
  gateway_url: https://hope-anchored-in-christ.netlify.app/.netlify/git/github
  repo: Flash1095/hope-anchored-in-christ
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Scripture", name: "scripture", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: "timeline"
    label: "Timeline"
    folder: "content/timeline"
    create: true
    slug: "{{fields.Title}}"
    identifier_field: "Title"
    extension: "json"
    format: "json"
    fields:
      - {label: "Title", name: "Title", widget: "string"}
      - {label: "Era", name: "Era", widget: "string"}
      - {label: "Date Approx", name: "DateApprox", widget: "string"}
      - {label: "Key Persons", name: "KeyPersons", widget: "list"}
      - {label: "Bible Books", name: "BibleBooks", widget: "list"}
      - {label: "Places", name: "Places", widget: "list"}
      - {label: "Events", name: "Events", widget: "list"}
      - {label: "Archaeological Finds", name: "ArchaeologicalFinds", widget: "list"}
      - {label: "Scripture Reference", name: "ScriptureReference", widget: "list"}
      - {label: "Blog Post Link", name: "BlogPostLink", widget: "string"}
  - name: "books"
    label: "Books of the Bible"
    folder: "content/books"
    create: true
    slug: "{{fields.Book}}"
    identifier_field: "Book"
    extension: "json"
    format: "json"
    fields:
      - {label: "Book", name: "Book", widget: "string"}
      - {label: "Testament", name: "Testament", widget: "string"}
      - {label: "Category", name: "Category", widget: "string"}
      - {label: "Traditional Author", name: "TraditionalAuthor", widget: "string"}
      - {label: "Date Approx", name: "DateApprox", widget: "string"}
      - {label: "Timeline Era", name: "TimelineEra", widget: "string"}
      - {label: "Key Theme", name: "KeyTheme", widget: "string"}
      - {label: "Summary", name: "Summary", widget: "text"}
      - {label: "Key Verses", name: "KeyVerses", widget: "list"}
      - {label: "Key People", name: "KeyPeople", widget: "list"}
      - {label: "Themes", name: "Themes", widget: "list"}
      - {label: "Purpose", name: "Purpose", widget: "string"}
      - {label: "Outline", name: "Outline", widget: "list"}
      - {label: "Historical Context", name: "HistoricalContext", widget: "text"}
      - {label: "Related Places", name: "Places", widget: "list"}
      - {label: "Related Events", name: "RelatedEvents", widget: "list"}
      - {label: "Study Introduction", name: "StudyIntroduction", widget: "text", required: false}
      - {label: "Basic Book Information & Overview", name: "StudyOverview", widget: "text", required: false}
      - {label: "Authorship & Composition", name: "StudyAuthorship", widget: "text", required: false}
      - {label: "Historical Background", name: "StudyHistoricalBackground", widget: "text", required: false}
      - {label: "Cultural & Religious Context", name: "StudyCulturalContext", widget: "text", required: false}
      - {label: "Literary Structure & Book Outline", name: "StudyLiteraryStructure", widget: "text", required: false}
      - {label: "Chapter-by-Chapter Studies", name: "StudyChapterByChapter", widget: "text", required: false}
      - {label: "Major Themes", name: "StudyMajorThemes", widget: "text", required: false}
      - {label: "Theology & Doctrine", name: "StudyTheologyDoctrine", widget: "text", required: false}
      - {label: "Jesus Christ & Messianic Connections", name: "StudyChristMessianic", widget: "text", required: false}
      - {label: "Biblical Prophecy & Fulfillment", name: "StudyProphecyFulfillment", widget: "text", required: false}
      - {label: "Biblical People & Genealogies", name: "StudyPeopleGenealogies", widget: "text", required: false}
      - {label: "Biblical Geography & Maps", name: "StudyGeographyMaps", widget: "text", required: false}
