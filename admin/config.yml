# Decap CMS configuration for Hope Anchored in Christ.
# Edit content at /admin after this repo is pushed to GitHub.
# Repo: Flash1095/hope-anchored-in-christ (see README for the login setup).
backend:
  name: git-gateway
  branch: main
  identity_url: https://hope-anchored-in-christ.netlify.app/.netlify/identity
  gateway_url: https://hope-anchored-in-christ.netlify.app/.netlify/git/github
  repo: Flash1095/hope-anchored-in-christ
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Scripture", name: "scripture", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: "timeline"
    label: "Timeline"
    folder: "content/timeline"
    create: true
    slug: "{{fields.Title}}"
    identifier_field: "Title"
    extension: "json"
    format: "json"
    fields:
      - {label: "Title", name: "Title", widget: "string"}
      - {label: "Era", name: "Era", widget: "string"}
      - {label: "Date Approx", name: "DateApprox", widget: "string"}
      - {label: "Key Persons", name: "KeyPersons", widget: "list"}
      - {label: "Bible Books", name: "BibleBooks", widget: "list"}
      - {label: "Places", name: "Places", widget: "list"}
      - {label: "Events", name: "Events", widget: "list"}
      - {label: "Archaeological Finds", name: "ArchaeologicalFinds", widget: "list"}
      - {label: "Scripture Reference", name: "ScriptureReference", widget: "list"}
      - {label: "Blog Post Link", name: "BlogPostLink", widget: "string"}
  - name: "books"
    label: "Books"
    folder: "content/books"
    create: true
    slug: "{{fields.Book}}"
    identifier_field: "Book"
    extension: "json"
    format: "json"
    fields:
      - {label: "Book", name: "Book", widget: "string"}
      - {label: "Testament", name: "Testament", widget: "string"}
      - {label: "Category", name: "Category", widget: "string"}
      - {label: "Traditional Author", name: "TraditionalAuthor", widget: "string"}
      - {label: "Date Approx", name: "DateApprox", widget: "string"}
      - {label: "Timeline Era", name: "TimelineEra", widget: "string"}
      - {label: "Key Theme", name: "KeyTheme", widget: "string"}
      - {label: "Summary", name: "Summary", widget: "text"}
      - {label: "Key Verses", name: "KeyVerses", widget: "list"}
      - {label: "Key People", name: "KeyPeople", widget: "list"}
      - {label: "Themes", name: "Themes", widget: "list"}
      - {label: "Purpose", name: "Purpose", widget: "string"}
      - {label: "Outline", name: "Outline", widget: "list"}
      - {label: "Historical Context", name: "HistoricalContext", widget: "text"}
  - name: "questions"
    label: "Questions"
    folder: "content/questions"
    create: true
    slug: "{{fields.Question}}"
    identifier_field: "Question"
    extension: "json"
    format: "json"
    fields:
      - {label: "Question", name: "Question", widget: "string"}
      - {label: "Slug", name: "Slug", widget: "string"}
      - {label: "Short Answer", name: "ShortAnswer", widget: "text"}
      - {label: "Detailed Answer", name: "DetailedAnswer", widget: "text"}
      - {label: "Category", name: "Category", widget: "string"}
      - {label: "Subcategory", name: "Subcategory", widget: "string"}
      - {label: "Bible References", name: "BibleReferences", widget: "list"}
      - {label: "Biblical Context", name: "BiblicalContext", widget: "string"}
      - {label: "Original Language", name: "OriginalLanguage", widget: "string"}
      - {label: "Historical Evidence", name: "HistoricalEvidence", widget: "string"}
      - {label: "Common Objections", name: "CommonObjections", widget: "string"}
      - {label: "Related Questions", name: "RelatedQuestions", widget: "list"}
      - {label: "Related Book", name: "RelatedBook", widget: "list"}
      - {label: "Timeline Era", name: "TimelineEra", widget: "string"}
      - {label: "Sources", name: "Sources", widget: "string"}
