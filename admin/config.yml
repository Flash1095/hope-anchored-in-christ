      - {label: "Questions & Answers", name: "StudyQuestionsAnswers", widget: "text", required: false}
      - {label: "Christian Church History & Historical Reception", name: "StudyChurchHistory", widget: "text", required: false}
      - {label: "Bible Translation Comparisons", name: "StudyTranslations", widget: "text", required: false}
      - {label: "Related Blog Posts & Articles", name: "StudyRelatedPosts", widget: "text", required: false}
      - {label: "Scholarly Sources, References & Further Reading", name: "StudySources", widget: "text", required: false}
