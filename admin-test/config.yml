backend:
  name: git-gateway
  branch: main
  identity_url: https://hope-anchored-in-christ.netlify.app/.netlify/identity
  gateway_url: https://hope-anchored-in-christ.netlify.app/.netlify/git/github
  repo: Flash1095/hope-anchored-in-christ
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
