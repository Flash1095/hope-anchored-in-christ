<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diag3 starting...</title>
<script>
window.__reqs = [];
function logReq(s){ window.__reqs.push(s); var pre = document.getElementById('out'); if (pre) pre.textContent += '\n' + s; }
(function(){
  var ofetch = window.fetch;
  window.fetch = function(){ var args = arguments; var url = String(args[0] && args[0].url || args[0]); return ofetch.apply(this, args).then(function(r){ logReq('FETCH ' + r.status + ' ' + url.slice(0, 140)); return r; }, function(e){ logReq('FETCH FAIL ' + url.slice(0, 140) + ' :: ' + e); throw e; }); };
  var oopen = XMLHttpRequest.prototype.open, osend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(m, u){ this.__u = u; return oopen.apply(this, arguments); };
  XMLHttpRequest.prototype.send = function(){ var xhr = this; xhr.addEventListener('load', function(){ logReq('XHR ' + xhr.status + ' ' + String(xhr.__u).slice(0, 140)); }); xhr.addEventListener('error', function(){ logReq('XHR FAIL ' + String(xhr.__u).slice(0, 140)); }); return osend.apply(this, arguments); };
})();
window.addEventListener('error', function(e){ logReq('ERROR: ' + (e.message || e)); }, true);
window.addEventListener('unhandledrejection', function(e){ var r = e.reason; logReq('REJECTION: ' + (r ? (r.message || r) : 'unknown')); });
setInterval(function(){ document.title = ('REQLOG ' + window.__reqs.join(' || ')).slice(0, 240); }, 3000);
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<pre id="out">starting diag3... (request log below)</pre>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
