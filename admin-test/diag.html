<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diag starting...</title>
<script>
window.__errs = [];
window.addEventListener('error', function(e){ window.__errs.push('ERROR: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); }, true);
window.addEventListener('unhandledrejection', function(e){ var r = e.reason; window.__errs.push('REJECTION: ' + (r ? (r.message || r) : 'unknown')); });
function report(msg){ var pre = document.getElementById('out'); if (pre) pre.textContent += msg + '\n'; }
window.addEventListener('load', function(){
  setTimeout(function(){
    var errs = window.__errs.length ? window.__errs.join(' || ') : 'none';
    var kids = document.body ? document.body.children.length : -1;
    var summary = 'DIAG errors=' + errs + ' | netlifyIdentity=' + (typeof window.netlifyIdentity) + ' | CMS=' + (typeof window.CMS) + ' | bodyChildren=' + kids + ' | hash=' + location.hash;
    report('--- after 10s ---');
    report('errors: ' + errs);
    report('netlifyIdentity: ' + (typeof window.netlifyIdentity));
    report('CMS: ' + (typeof window.CMS));
    report('body children: ' + kids);
    report('hash: ' + location.hash);
    document.title = summary.slice(0, 240);
  }, 10000);
});
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<pre id="out">starting diag...</pre>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
