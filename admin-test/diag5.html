<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diag5 starting...</title>
<script>
window.__reqs = [];
function logReq(s){ window.__reqs.push(s); var pre = document.getElementById('out'); if (pre) pre.textContent += '\n' + s; }
(function(){
  var ofetch = window.fetch;
  window.fetch = function(){ var args = arguments; var url = String(args[0] && args[0].url || args[0]); return ofetch.apply(this, args).then(function(r){ logReq('FETCH ' + r.status + ' ' + url.slice(0, 160)); return r; }, function(e){ logReq('FETCH FAIL ' + url.slice(0, 160) + ' :: ' + e); throw e; }); };
})();
window.addEventListener('error', function(e){ logReq('ERROR: ' + (e.message || e)); }, true);
window.addEventListener('unhandledrejection', function(e){ var r = e.reason; logReq('REJECTION: ' + (r ? (r.message || r) : 'unknown')); });
setInterval(function(){ document.title = ('REQLOG ' + window.__reqs.join(' || ')).slice(0, 240); }, 3000);
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<pre id="out">starting diag5... (request log below)</pre>
<script>
  try {
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({ APIUrl: 'https://hope-anchored-in-christ.netlify.app/.netlify/identity' });
      logReq('WIDGET INIT OK with Netlify APIUrl');
    } else {
      logReq('WIDGET INIT SKIPPED: no netlifyIdentity');
    }
  } catch (e) {
    logReq('WIDGET INIT THREW: ' + (e && e.message ? e.message : e));
  }
</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
