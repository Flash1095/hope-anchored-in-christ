<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout fetch test (temporary)</title>
<body>
<pre id="out">running…</pre>
<script>
var out = document.getElementById("out");
var lines = ["origin: " + location.origin, "online: " + navigator.onLine];
fetch("https://hope-anchored-checkout.hopeanchoredinchrist.workers.dev/config")
  .then(function (r) {
    lines.push("fetch ok, HTTP " + r.status);
    return r.text().then(function (t) {
      lines.push("body: " + t.slice(0, 200));
      out.textContent = lines.join("\n");
    });
  })
  .catch(function (e) {
    lines.push("FETCH FAILED: " + e.name + ": " + e.message);
    out.textContent = lines.join("\n");
  });
</script>
</body>
